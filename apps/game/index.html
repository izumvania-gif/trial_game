<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EFERON: The Other Hand</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" hidden></canvas>
    <div id="overlay"></div>
    <section id="title">
      <canvas id="spiral" aria-hidden="true"></canvas>
      <main>
        <h1>EFERON</h1>
        <p class="subtitle">The Other Hand</p>
        <p class="log" id="cycle">CYCLE RUN #····</p>
        <button id="wake" type="button">Wake</button>
        <p class="hand">Don't look at the sky. Look into the stone.</p>
        <button id="tablet" type="button" class="ghost tablet-link">Wax tablet</button>
        <section id="tablet-panel" hidden>
          <p>Carry your memory to another computer. The code is everything you know.</p>
          <textarea id="tablet-code" rows="4" spellcheck="false"></textarea>
          <div><button id="tablet-import" type="button" class="ghost">Press it into the wax</button></div>
          <p id="tablet-status" class="log"></p>
        </section>
        <p class="controls">WASD walk · E talk · F finish their sentence · C chronicle · B strangers · M mask · R lyre · Esc step back</p>
      </main>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
