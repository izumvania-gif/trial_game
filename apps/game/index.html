<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EFERON: The Other Hand</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view" hidden></canvas>
    <div id="overlay"></div>
    <section id="title">
      <canvas id="spiral" aria-hidden="true"></canvas>
      <main>
        <h1>EFERON</h1>
        <p class="subtitle">The Other Hand</p>
        <p class="log" id="cycle">CYCLE RUN #····</p>
        <button id="wake" type="button">Wake</button>
        <p class="hand">Don't look at the sky. Look into the stone.</p>
        <div class="title-links">
          <button id="settings" type="button" class="ghost tablet-link">Settings</button>
          <button id="tablet" type="button" class="ghost tablet-link">Wax tablet</button>
        </div>
        <section id="tablet-panel" hidden>
          <p>Carry your memory to another computer. The code is everything you know.</p>
          <textarea id="tablet-code" rows="4" spellcheck="false"></textarea>
          <div><button id="tablet-import" type="button" class="ghost">Press it into the wax</button></div>
          <p id="tablet-status" class="log"></p>
        </section>
      </main>
      <footer class="title-legend" aria-label="Controls">
        <span class="key-item"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk</span>
        <span class="key-item"><kbd>E</kbd> talk</span>
        <span class="key-item"><kbd>F</kbd> finish their sentence</span>
        <span class="key-item"><kbd>C</kbd> chronicle</span>
        <span class="key-item"><kbd>B</kbd> strangers</span>
        <span class="key-item"><kbd>H</kbd> help</span>
        <span class="key-item"><kbd>O</kbd> settings</span>
        <span class="key-item"><kbd class="wide">Esc</kbd> step back</span>
      </footer>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
